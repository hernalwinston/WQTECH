<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .page { min-height: 100vh; background: var(--bg); }
    .page-content { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
    .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .page-header h1 { font-size:1.4rem; font-weight:700; }

    .avatar-section { text-align:center; margin-bottom:32px; }
    .avatar-large {
      width:100px; height:100px; border-radius:50%; margin:0 auto 16px;
      background:var(--accent-light); color:var(--accent);
      display:flex; align-items:center; justify-content:center;
      font-size:2.5rem; font-weight:800; position:relative; overflow:hidden;
    }
    .avatar-large img { width:100%; height:100%; object-fit:cover; }
    .avatar-upload {
      position:absolute; bottom:0; left:0; right:0; height:32px;
      background:rgba(0,0,0,0.5); color:white; display:flex;
      align-items:center; justify-content:center; cursor:pointer;
      font-size:0.75rem; font-weight:600;
    }
    .avatar-upload:hover { background:rgba(0,0,0,0.7); }
    .avatar-label { font-size:0.85rem; color:var(--text-muted); }

    .edit-card {
      background:var(--card); border:1px solid var(--card-border);
      border-radius:var(--radius-xl); padding:28px; box-shadow:var(--shadow);
      margin-bottom:24px;
    }
    .edit-card h3 { font-size:1.1rem; font-weight:700; margin-bottom:20px; }
    .form-row { margin-bottom:16px; }
    .form-row label { display:block; font-weight:600; font-size:0.85rem; margin-bottom:6px; color:var(--text); }
    .form-row input, .form-row textarea {
      width:100%; padding:12px 16px; background:var(--input-bg);
      border:1px solid var(--input-border); border-radius:var(--radius);
      font-size:0.95rem; color:var(--text); outline:none; transition:var(--transition);
      font-family:inherit;
    }
    .form-row input:focus, .form-row textarea:focus {
      border-color:var(--input-focus); box-shadow:0 0 0 3px var(--accent-light);
    }
    .form-row textarea { resize:vertical; min-height:80px; }

    .stats-grid {
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:24px;
    }
    .stat-box {
      background:var(--card); border:1px solid var(--card-border);
      border-radius:var(--radius-lg); padding:20px; text-align:center;
      box-shadow:var(--shadow-sm);
    }
    .stat-box .val { font-size:1.6rem; font-weight:800; color:var(--accent); }
    .stat-box .lbl { font-size:0.8rem; color:var(--text-muted); margin-top:4px; }

    .save-status { text-align:center; font-size:0.85rem; color:var(--success); margin-top:8px; display:none; }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="page">
    <nav class="navbar">
      <a href="dashboard.html" class="navbar-brand">WQTech</a>
      <div class="navbar-actions">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
        </button>
      </div>
    </nav>

    <div class="page-content">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-box"><div class="val" id="statPoints">0</div><div class="lbl">Total Points</div></div>
        <div class="stat-box"><div class="val" id="statGames">0</div><div class="lbl">Games Played</div></div>
        <div class="stat-box"><div class="val" id="statRank">-</div><div class="lbl">Global Rank</div></div>
      </div>

      <div class="avatar-section">
        <div class="avatar-large" id="avatarDisplay">
          <span id="avatarLetter">?</span>
          <div class="avatar-upload" onclick="document.getElementById('avatarInput').click()">Change Photo</div>
          <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(this)">
        </div>
        <div class="avatar-label">Click on avatar to upload a photo</div>
      </div>

      <div class="edit-card">
        <h3>Personal Information</h3>
        <div class="form-row">
          <label>Full Name</label>
          <input type="text" id="editName" placeholder="Your name">
        </div>
        <div class="form-row">
          <label>Year / Section</label>
          <input type="text" id="editYear" placeholder="e.g., Grade 11 - Newton">
        </div>
        <div class="form-row">
          <label>Bio</label>
          <textarea id="editBio" placeholder="Tell something about yourself..."></textarea>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="saveProfile()">Save Changes</button>
        <div class="save-status" id="saveStatus">Profile updated successfully!</div>
      </div>

      <a href="dashboard.html" class="btn btn-outline btn-lg" style="width:100%; margin-top:8px;">Go to Dashboard</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let profileData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (!user) { window.location.href = '../index.html'; return; }
      if (Auth.isAdmin) { window.location.href = 'admin.html'; return; }
      await loadProfile(user.id);
      await loadRank(user.id);
    });

    async function loadProfile(uid) {
      const { data } = await supabaseClient.from('user_profiles').select('*').eq('id', uid).single();
      if (!data) { window.location.href = 'dashboard.html'; return; }
      profileData = data;

      document.getElementById('editName').value = data.name || '';
      document.getElementById('editYear').value = data.year_section || '';
      document.getElementById('editBio').value = data.bio || '';
      document.getElementById('statPoints').textContent = data.total_points || 0;
      document.getElementById('statGames').textContent = data.games_played || 0;

      if (data.avatar_url) {
        document.getElementById('avatarLetter').style.display = 'none';
        const img = document.createElement('img');
        img.src = data.avatar_url;
        document.getElementById('avatarDisplay').insertAdjacentElement('afterbegin', img);
      } else {
        document.getElementById('avatarLetter').textContent = data.name ? data.name.charAt(0).toUpperCase() : '?';
      }
    }

    async function loadRank(uid) {
      const { data: all } = await supabaseClient.from('user_profiles').select('id, total_points').order('total_points', { ascending: false });
      if (all) {
        const rank = all.findIndex(p => p.id === uid) + 1;
        document.getElementById('statRank').textContent = rank > 0 ? '#' + rank : '-';
      }
    }

    async function uploadAvatar(input) {
      const file = input.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) return Utils.showToast('Image must be under 2MB', 'error');

      Utils.showLoading();
      const ext = file.name.split('.').pop();
      const path = `avatars/${Auth.currentUser.id}.${ext}`;

      const { error: upErr } = await supabaseClient.storage.from('avatars').upload(path, file, { upsert: true });
      if (upErr) { Utils.hideLoading(); return Utils.showToast('Upload failed', 'error'); }

      const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(path);
      const publicUrl = urlData.publicUrl + '?t=' + Date.now();

      await supabaseClient.from('user_profiles').update({ avatar_url: publicUrl }).eq('id', Auth.currentUser.id);

      const oldImg = document.querySelector('#avatarDisplay img');
      if (oldImg) oldImg.remove();
      document.getElementById('avatarLetter').style.display = 'none';
      const img = document.createElement('img');
      img.src = publicUrl;
      document.getElementById('avatarDisplay').insertAdjacentElement('afterbegin', img);

      Utils.hideLoading();
      Utils.showToast('Photo updated!', 'success');
    }

    async function saveProfile() {
      const name = document.getElementById('editName').value.trim();
      const year = document.getElementById('editYear').value.trim();
      const bio = document.getElementById('editBio').value.trim();
      if (!name) return Utils.showToast('Name is required', 'error');

      Utils.showLoading();
      const { error } = await supabaseClient.from('user_profiles').update({
        name: name, year_section: year, bio: bio
      }).eq('id', Auth.currentUser.id);
      Utils.hideLoading();

      if (error) return Utils.showToast(error.message, 'error');

      const status = document.getElementById('saveStatus');
      status.style.display = 'block';
      setTimeout(() => { status.style.display = 'none'; }, 3000);

      document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();
    }
  </script>
</body>
</html>
