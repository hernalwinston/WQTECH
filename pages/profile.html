<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="page">
    <nav class="navbar">
      <a href="dashboard.html" class="navbar-brand">WQTech</a>
      <div class="navbar-actions">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
        </button>
      </div>
    </nav>

    <div class="page-content">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-box"><div class="val" id="statPoints">0</div><div class="lbl">Total Points</div></div>
        <div class="stat-box"><div class="val" id="statGames">0</div><div class="lbl">Games Played</div></div>
        <div class="stat-box"><div class="val" id="statRank">-</div><div class="lbl">Global Rank</div></div>
      </div>

      <div class="avatar-section">
        <div class="avatar-large" id="avatarDisplay">
          <span id="avatarLetter">?</span>
          <div class="avatar-upload" onclick="document.getElementById('avatarInput').click()">Change Photo</div>
          <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(this)">
        </div>
        <div class="avatar-label">Click on avatar to upload a photo</div>
      </div>

      <div class="edit-card">
        <h3>Personal Information</h3>
        <div class="form-row">
          <label>Full Name</label>
          <input type="text" id="editName" placeholder="Your name">
        </div>
        <div class="form-row">
          <label>Year / Section</label>
          <input type="text" id="editYear" placeholder="e.g., Grade 11 - Newton">
        </div>
        <div class="form-row">
          <label>Bio</label>
          <textarea id="editBio" placeholder="Tell something about yourself..."></textarea>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="saveProfile()">Save Changes</button>
        <div class="save-status" id="saveStatus">Profile updated successfully!</div>
      </div>

      <a href="dashboard.html" class="btn btn-outline btn-lg" style="width:100%; margin-top:8px;">Go to Dashboard</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
