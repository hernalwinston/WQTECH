<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game History - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .page { min-height:100vh; background:var(--bg); }
    .page-content { max-width:760px; margin:0 auto; padding:32px 20px; }
    .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .page-header h1 { font-size:1.4rem; font-weight:700; }

    .history-card {
      background:var(--card); border:1px solid var(--card-border);
      border-radius:var(--radius-xl); overflow:hidden;
      box-shadow:var(--shadow-sm); margin-bottom:16px; transition:var(--transition);
    }
    .history-card:hover { border-color:var(--card-hover-border); }
    .history-top {
      display:flex; align-items:center; gap:16px; padding:20px 24px;
      cursor:pointer; user-select:none;
    }
    .history-icon {
      width:48px; height:48px; border-radius:var(--radius);
      background:var(--accent-light); color:var(--accent);
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; font-weight:700; flex-shrink:0;
    }
    .history-info { flex:1; }
    .history-info h4 { font-size:1rem; font-weight:700; margin-bottom:2px; }
    .history-info p { font-size:0.85rem; color:var(--text-secondary); }
    .history-score { text-align:right; }
    .history-score .pts { font-size:1.2rem; font-weight:800; color:var(--accent); }
    .history-score .rank { font-size:0.8rem; color:var(--text-muted); }
    .history-toggle { font-size:1.2rem; color:var(--text-muted); transition:transform 0.3s; }
    .history-card.open .history-toggle { transform:rotate(180deg); }

    .history-details {
      display:none; padding:0 24px 20px;
      border-top:1px solid var(--card-border);
    }
    .history-card.open .history-details { display:block; animation:fadeIn 0.3s ease; }

    .detail-row {
      display:flex; align-items:center; gap:12px; padding:12px 0;
      border-bottom:1px solid var(--card-border);
    }
    .detail-row:last-child { border-bottom:none; }
    .detail-q { flex:1; font-size:0.9rem; }
    .detail-result {
      display:flex; gap:8px; align-items:center; font-size:0.85rem; font-weight:600;
    }
    .detail-result .correct-tag { color:var(--success); }
    .detail-result .wrong-tag { color:var(--danger); }
    .detail-score { min-width:50px; text-align:right; font-weight:700; font-size:0.9rem; }

    .summary-bar {
      display:flex; gap:20px; padding:16px 24px; background:var(--bg-secondary);
      border-top:1px solid var(--card-border);
    }
    .summary-bar span { font-size:0.85rem; color:var(--text-secondary); font-weight:600; }
    .summary-bar .correct-count { color:var(--success); }
    .summary-bar .wrong-count { color:var(--danger); }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="page">
    <nav class="navbar">
      <a href="dashboard.html" class="navbar-brand">WQTech</a>
      <div class="navbar-actions">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
        </button>
      </div>
    </nav>

    <div class="page-content">
      <div class="page-header">
        <h1>Game History</h1>
      </div>
      <div id="historyContainer">
        <div class="empty-state"><p>No games played yet. Join a game to get started!</p></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (!user) { window.location.href = '../index.html'; return; }
      if (Auth.isAdmin) { window.location.href = 'admin.html'; return; }
      await loadHistory(user.id);
    });

    async function loadHistory(uid) {
      const { data: entries } = await supabaseClient.from('leaderboards')
        .select('*').eq('user_id', uid).order('played_at', { ascending: false });

      const c = document.getElementById('historyContainer');
      if (!entries || entries.length === 0) {
        c.innerHTML = '<div class="empty-state"><p>No games played yet. Join a game to get started!</p></div>';
        return;
      }

      let html = '';
      for (const e of entries) {
        const { data: answers } = await supabaseClient.from('game_answers')
          .select('*').eq('game_id', e.game_id).eq('user_id', uid).order('question_index');

        let correctCount = 0, wrongCount = 0;
        const detailRows = [];
        if (answers && answers.length > 0) {
          answers.forEach((a, i) => {
            if (a.correct) correctCount++; else wrongCount++;
            const icon = a.correct
              ? '<span class="correct-tag">&#10003; Correct</span>'
              : '<span class="wrong-tag">&#10007; Wrong</span>';
            detailRows.push(`
              <div class="detail-row">
                <div class="detail-q">Question ${i+1}</div>
                <div class="detail-result">${icon}</div>
                <div class="detail-score">${a.score || 0} pts</div>
              </div>
            `);
          });
        }

        const played = new Date(e.played_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
        const qCount = e.total_questions || (answers ? answers.length : 0);
        const viol = e.violation_points || 0;
        const violTag = viol < 0 ? `<div class="rank" style="color:#DC2626;">${viol} penalty pts</div>` : '';

        html += `
          <div class="history-card" onclick="this.classList.toggle('open')">
            <div class="history-top">
              <div class="history-icon">${(e.quiz_title||'Q').charAt(0).toUpperCase()}</div>
              <div class="history-info">
                <h4>${Utils.sanitize(e.quiz_title || 'Quiz')}</h4>
                <p>${played} &middot; ${qCount} questions</p>
              </div>
              <div class="history-score">
                <div class="pts">${e.total_score || 0} pts</div>
                <div class="rank">${e.correct_count || 0}/${qCount} correct</div>
                ${violTag}
              </div>
              <div class="history-toggle">&#9662;</div>
            </div>
            <div class="history-details">
              ${detailRows.join('')}
              <div class="summary-bar">
                <span class="correct-count">&#10003; ${correctCount} correct</span>
                <span class="wrong-count">&#10007; ${wrongCount} wrong</span>
                ${viol < 0 ? `<span style="color:#DC2626;">Penalties: ${viol} pts</span>` : ''}
                <span>Score: ${e.total_score || 0} pts</span>
              </div>
            </div>
          </div>
        `;
      }
      c.innerHTML = html;
    }
  </script>
</body>
</html>
