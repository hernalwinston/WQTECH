<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .auth-orb {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%);
      filter: blur(60px);
      animation: float 10s ease-in-out infinite;
      pointer-events: none;
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
    }

    .auth-card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-card .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a { font-weight: 600; }

    .theme-corner {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .step-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--input-border);
      transition: var(--transition);
    }

    .step-dot.active { background: var(--accent); transform: scale(1.2); }
    .step-dot.done { background: var(--success); }

    .step-panel { display: none; }
    .step-panel.active { display: block; animation: fadeIn 0.3s ease; }

    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn-group .btn { flex: 1; }

    .preview-card {
      text-align: center;
      padding: 32px 24px;
    }

    .preview-card h3 { margin-bottom: 4px; }
    .preview-card p { color: var(--text-secondary); }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="auth-page">
    <div class="auth-orb"></div>
    <div class="auth-card">
      <div class="theme-corner">
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
        </button>
      </div>

      <h1>Create Account</h1>
      <p class="subtitle">Join QuizBattle and start competing</p>

      <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
      </div>

      <!-- Step 1 -->
      <div class="step-panel active" id="step1">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" id="regName" placeholder="e.g., Juan Dela Cruz">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="regEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="regPassword" placeholder="Create a password" style="padding-right:45px;">
            <button type="button" class="eye-btn" onclick="togglePass('regPassword', this)" aria-label="Toggle password visibility">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="regConfirm" placeholder="Confirm your password" style="padding-right:45px;">
            <button type="button" class="eye-btn" onclick="togglePass('regConfirm', this)" aria-label="Toggle password visibility">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Year / Section</label>
          <input type="text" class="form-control" id="regYear" placeholder="e.g., Grade 11 - Newton">
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="goToStep(2)">Next</button>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step-panel" id="step2">
        <div class="card preview-card">
          <h3 id="previewName"></h3>
          <p id="previewEmail"></p>
        </div>
        <div class="btn-group">
          <button class="btn btn-outline" onclick="goToStep(1)">Back</button>
          <button class="btn btn-success btn-lg" onclick="completeRegistration()" style="flex:2;">Create Account</button>
        </div>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="../index.html">Login</a>
      </div>
      <div style="text-align:center; margin-top:16px;">
        <a href="../index.html" style="color:var(--text-muted); font-size:0.85rem;">Back to Home</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    let currentStep = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (user) {
        const { data } = await supabaseClient.from('user_profiles').select('id').eq('id', user.id).maybeSingle();
        if (data) window.location.href = 'dashboard.html';
      }
    });

    function togglePass(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const eyeOpen = btn.querySelector('.eye-open');
      const eyeClosed = btn.querySelector('.eye-closed');
      if (field.type === 'password') {
        field.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        field.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    }

    function goToStep(step) {
      if (step === 2 && currentStep === 1) {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const year = document.getElementById('regYear').value.trim();
        if (!name) return Utils.showToast('Please enter your name', 'error');
        if (!email) return Utils.showToast('Please enter your email', 'error');
        if (!password || password.length < 6) return Utils.showToast('Password must be at least 6 characters', 'error');
        if (password !== confirm) return Utils.showToast('Passwords do not match', 'error');
        if (!year) return Utils.showToast('Please enter your year/section', 'error');
        document.getElementById('previewName').textContent = name;
        document.getElementById('previewEmail').textContent = email;
      }

      document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`step${step}`).classList.add('active');

      document.querySelectorAll('.step-dot').forEach((d, i) => {
        d.classList.remove('active', 'done');
        if (i + 1 < step) d.classList.add('done');
        if (i + 1 === step) d.classList.add('active');
      });

      currentStep = step;
    }

    async function completeRegistration() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const year = document.getElementById('regYear').value.trim();

      Utils.showLoading();
      const result = await Auth.registerStudent(name, year, email, password);
      Utils.hideLoading();

      if (result.success) {
        Utils.showToast('Account created!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        Utils.showToast(result.error, 'error');
      }
    }
  </script>
</body>
</html>
