<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rankings - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .page { min-height:100vh; background:var(--bg); }
    .page-content { max-width:640px; margin:0 auto; padding:32px 20px; }
    .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .page-header h1 { font-size:1.4rem; font-weight:700; }

    .podium { display:flex; gap:16px; justify-content:center; margin-bottom:36px; align-items:flex-end; }
    .podium-slot {
      display:flex; flex-direction:column; align-items:center; gap:8px;
      padding:20px 24px; border-radius:var(--radius-xl);
      min-width:120px; text-align:center;
    }
    .podium-slot.p1 { background:linear-gradient(135deg, #FBBF24, #F59E0B); color:#1A1A1A; order:2; padding-bottom:28px; }
    .podium-slot.p2 { background:linear-gradient(135deg, #D1D5DB, #9CA3AF); color:#1A1A1A; order:1; }
    .podium-slot.p3 { background:linear-gradient(135deg, #D97706, #B45309); color:white; order:3; }
    .podium-avatar {
      width:52px; height:52px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; font-weight:800; overflow:hidden;
    }
    .p1 .podium-avatar { background:rgba(0,0,0,0.12); }
    .p2 .podium-avatar { background:rgba(0,0,0,0.1); }
    .p3 .podium-avatar { background:rgba(255,255,255,0.2); }
    .podium-avatar img { width:100%; height:100%; object-fit:cover; }
    .podium-name { font-weight:700; font-size:0.9rem; }
    .podium-pts { font-weight:800; font-size:1.1rem; }
    .podium-rank { font-size:0.75rem; font-weight:600; opacity:0.7; }

    .rankings-list { margin-top:8px; }
    .rank-row {
      display:flex; align-items:center; gap:14px;
      padding:14px 18px; margin-bottom:8px;
      border-radius:var(--radius); background:var(--card);
      border:1px solid var(--card-border); transition:var(--transition);
    }
    .rank-row.is-me { outline:2px solid var(--accent); outline-offset:2px; }
    .rank-num { font-weight:800; min-width:32px; text-align:center; color:var(--text-secondary); font-size:0.95rem; }
    .rank-avatar {
      width:38px; height:38px; border-radius:50%; flex-shrink:0;
      background:var(--accent-light); color:var(--accent);
      display:flex; align-items:center; justify-content:center;
      font-size:0.9rem; font-weight:700; overflow:hidden;
    }
    .rank-avatar img { width:100%; height:100%; object-fit:cover; }
    .rank-name { flex:1; font-weight:600; font-size:0.95rem; }
    .rank-pts { font-weight:700; font-size:1rem; color:var(--accent); }
    .rank-games { font-size:0.8rem; color:var(--text-muted); }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="page">
    <nav class="navbar">
      <a href="dashboard.html" class="navbar-brand">WQTech</a>
      <div class="navbar-actions">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
        </button>
      </div>
    </nav>

    <div class="page-content">
      <div class="page-header">
        <h1>Global Rankings</h1>
      </div>

      <div class="podium" id="podium"></div>
      <div class="rankings-list" id="rankingsList"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (!user) { window.location.href = '../index.html'; return; }
      // Admins have no student dashboard - send them back to the admin panel
      if (Auth.isAdmin) {
        document.querySelectorAll('a[href="dashboard.html"]').forEach(a => a.setAttribute('href', 'admin.html'));
      }
      await loadRankings(user.id);
    });

    function getInitial(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
    function avatarHtml(url, name, size) {
      if (url) return `<img src="${url}" alt="" style="width:${size}px;height:${size}px;object-fit:cover;">`;
      return getInitial(name);
    }

    async function loadRankings(uid) {
      const { data: players } = await supabaseClient.from('user_profiles')
        .select('id, name, avatar_url, total_points, games_played')
        .order('total_points', { ascending: false }).limit(100);

      if (!players || players.length === 0) {
        document.getElementById('rankingsList').innerHTML = '<div class="empty-state"><p>No rankings yet. Play a game to get started!</p></div>';
        return;
      }

      const podium = document.getElementById('podium');
      const top3 = players.slice(0, 3);
      const order = [1, 0, 2];
      let pHtml = '';
      order.forEach(i => {
        const p = top3[i];
        if (!p) return;
        const cls = i === 0 ? 'p1' : i === 1 ? 'p2' : 'p3';
        pHtml += `
          <div class="podium-slot ${cls}">
            <div class="podium-rank">#${i+1}</div>
            <div class="podium-avatar">${avatarHtml(p.avatar_url, p.name, 52)}</div>
            <div class="podium-name">${Utils.sanitize(p.name)}</div>
            <div class="podium-pts">${p.total_points} pts</div>
          </div>
        `;
      });
      podium.innerHTML = pHtml;

      let rHtml = '';
      players.slice(3, 100).forEach((p, i) => {
        const me = p.id === uid ? ' is-me' : '';
        rHtml += `
          <div class="rank-row${me}">
            <span class="rank-num">#${i+4}</span>
            <div class="rank-avatar">${avatarHtml(p.avatar_url, p.name, 38)}</div>
            <span class="rank-name">${Utils.sanitize(p.name)}</span>
            <div style="text-align:right;">
              <div class="rank-pts">${p.total_points} pts</div>
              <div class="rank-games">${p.games_played} games</div>
            </div>
          </div>
        `;
      });
      document.getElementById('rankingsList').innerHTML = rHtml;
    }
  </script>
</body>
</html>
