<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Admin - QuizBattle</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; position: relative;
    }
    .auth-orb {
      position: absolute; width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      filter: blur(60px); animation: float 10s ease-in-out infinite;
      pointer-events: none;
    }
    .auth-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: var(--radius-xl); padding: 40px;
      max-width: 440px; width: 100%;   
      box-shadow: var(--shadow-lg);
      position: relative; z-index: 1; text-align: center;
    }
    .auth-card h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
    .auth-card .subtitle { color: var(--text-secondary); margin-bottom: 32px; font-size: 0.95rem; }
    .auth-card .form-group { text-align: left; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted); }
    .auth-footer a { font-weight: 600; }
    .theme-corner { position: absolute; top: 16px; right: 16px; }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <div class="auth-page">
    <div class="auth-orb"></div>
    <div class="auth-card">
      <div class="theme-corner">
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
          <div class="knob">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
        </button>
      </div>

      <h1>Setup Admin</h1>
      <p class="subtitle">Create the first admin account for QuizBattle</p>

      <div id="setupForm">
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" class="form-control" id="adminName" placeholder="e.g., Teacher Juan">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="adminEmail" placeholder="admin@school.edu">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="adminPassword" placeholder="Min 6 characters" style="padding-right:45px;">
            <button type="button" class="eye-btn" onclick="togglePass()" aria-label="Toggle password visibility">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%;" onclick="createAdmin()">Create Admin Account</button>
      </div>

      <div id="setupResult" style="display:none;"></div>

      <div class="auth-footer">
        <a href="admin.html">Go to Admin Login</a>
      </div>
      <div style="text-align:center; margin-top:16px;">
        <a href="../index.html" style="color:var(--text-muted); font-size:0.85rem;">Back to Home</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/theme.js"></script>

  <script>
    supabaseClient.from('admins').select('id').limit(1).then(({ data }) => {
      if (data && data.length > 0) {
        document.getElementById('setupForm').style.display = 'none';
        const r = document.getElementById('setupResult'); r.style.display = 'block';
        r.innerHTML = '<div class="success-box"><h3>Admin Already Exists</h3><p>An admin account is already configured.</p><p style="margin-top:12px;"><a href="admin.html">Go to Admin Login</a></p></div>';
      }
    });

    function togglePass() {
      const f = document.getElementById('adminPassword'), b = event.currentTarget;
      const eyeOpen = b.querySelector('.eye-open');
      const eyeClosed = b.querySelector('.eye-closed');
      if (f.type === 'password') {
        f.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        f.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    }

    async function createAdmin() {
      const name = document.getElementById('adminName').value.trim();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      if (!name) return alert('Enter a name');
      if (!email) return alert('Enter an email');
      if (!password || password.length < 6) return alert('Password must be 6+ characters');

      document.getElementById('loading-overlay').style.display = 'flex';
      try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { display_name: name } } });
        if (error) throw error;
        if (!data.user) throw new Error('No user created');

        const { error: ae } = await supabaseClient.from('admins').insert({ id: data.user.id, email, display_name: name, role: 'admin' });
        if (ae) throw ae;

        await supabaseClient.from('user_profiles').upsert({ id: data.user.id, name, total_points: 0, games_played: 0 }, { onConflict: 'id', ignoreDuplicates: true });

        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('setupForm').style.display = 'none';
        const r = document.getElementById('setupResult'); r.style.display = 'block';
        r.innerHTML = `<div class="success-box"><h3>Admin Created!</h3><p>Email: ${email}</p><p style="margin-top:12px;"><a href="admin.html">Go to Admin Login</a></p></div>`;
      } catch (err) {
        document.getElementById('loading-overlay').style.display = 'none';
        const r = document.getElementById('setupResult'); r.style.display = 'block';
        r.innerHTML = `<div class="error-box"><h3>Error</h3><p>${err.message}</p></div>`;
      }
    }
  </script>
</body>
</html>
