<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Live Contest - WQTech</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/programming.css">
  <script>document.documentElement.classList.add('auth-gate');</script>
  <style>
    .auth-gate body { visibility: hidden; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="programming.html" class="navbar-brand">WQTech <span>Programming</span></a>
    <div class="navbar-actions">
      <a href="../dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
      <a href="programming.html" class="btn btn-ghost btn-sm">Hub</a>
      <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
        <div class="knob">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
      </button>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="pl-page" id="plStage"></main>

  <div id="loading-overlay"><div class="spinner"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/piston-config.js"></script>
  <script src="../../js/programming-shared.js"></script>
  <script src="../../js/programming-live.js"></script>

  <script>
    // ============================================================
    // LIVE CONTEST HOST PANEL | teacher side
    // Create -> lobby (PIN) -> start -> live leaderboard -> end
    // ============================================================
    const $ = (id) => document.getElementById(id);
    let GAME = null, ACTIVITY = null, CH_GAME = null, CH_RES = null, CH_CHEAT = null;
    let POLL = null, STAGE = 'setup';          // setup | lobby | running | ended
    let SEEN_CHEAT = new Map();

    function esc(s) { return Utils ? Utils.sanitize(s || '') : String(s || ''); }
    function fmtTime(ms) {
      if (ms == null) return '—';
      const f = (n) => String(n).padStart(2, '0');
      return f(Math.floor(ms / 60000)) + ':' + f(Math.floor((ms % 60000) / 1000));
    }

    async function logout() { await Auth.logout(); window.location.href = '../index.html'; }

    async function hostBoot() {
      Utils.showLoading();
      const user = await Auth.init();
      if (!user) { window.location.href = '../index.html'; return; }
      document.documentElement.classList.remove('auth-gate');
      const isT = await Programming.isTeacher();
      if (!isT) { Utils.hideLoading(); $('plStage').innerHTML = fatalCard('Only teachers can host a live contest.'); return; }

      let pre = new URLSearchParams(window.location.search).get('activity');
      if (pre) {
        try {
          const a = await Programming.loadActivity(pre);
          if (a && a.activity) { ACTIVITY = a; renderStage('config'); Utils.hideLoading(); return; }
        } catch (e) {}
      }
      renderStage('setup');
      Utils.hideLoading();
    }

function fatalCard(msg) {
      return '<div class="pl-center"><div class="pl-card"><h2 style="color:var(--danger);margin:0 0 18px;text-align:center;">' + esc(msg) + '</h2>' +
        '<div class="pl-actions" style="justify-content:center;"><button class="btn btn-primary" onclick="window.location.href=\'../dashboard.html\'">Back to Dashboard</button></div></div></div>';
    }

    // ---------- SETUP (pick activity) ----------
    async function loadActivityList() {
      const box = $('activityPicker');
      try {
        const all = await Programming.listActivities();
        const mine = all.filter(a => (a.created_by === ProgLive.uid()) || a.status === 'published');
        if (!mine.length) {
          box.innerHTML = '<div class="pl-empty">No activities yet. <a href="create-programming.html" class="btn btn-ghost btn-sm">Create one first</a></div>';
          return;
        }
        box.innerHTML = mine.map(a =>
          '<div class="pl-actcard' + (ACTIVITY && ACTIVITY.activity && ACTIVITY.activity.id === a.id ? ' sel' : '') + '" data-id="' + esc(a.id) + '" onclick="pickActivity(\'' + esc(a.id) + '\')">' +
            '<div><b>' + esc(a.title) + '</b><span class="pl-badge ' + (a.status === 'draft' ? 'draft' : 'pub') + '">' + esc(a.status) + '</span></div>' +
            '<span class="pl-actmeta">' + esc(a.language) + ' · ' + (a.time_limit_minutes || 30) + ' min</span>' +
          '</div>').join('');
      } catch (e) {
        box.innerHTML = '<div class="pl-empty">Could not load activities: ' + esc(e.message) + '</div>';
      }
    }
    function pickActivity(id) {
      loadActivityFor(id);
    }
    async function loadActivityFor(id) {
      try {
        const a = await Programming.loadActivity(id);
        if (a && a.activity) {
          ACTIVITY = a;
          renderStage('config');
          loadActivityList();
        }
      } catch (e) { Utils.showToast('Could not load activity', 'error'); }
    }

    async function createContest() {
      if (!ACTIVITY || !ACTIVITY.activity) { Utils.showToast('Pick an activity first', 'error'); return; }
      const minutes = parseInt($('cfgMinutes').value, 10) || 30;
      const penalty = parseInt($('cfgPenalty').value, 10) || 5;
      const maxV = parseInt($('cfgMaxViol').value, 10) || 3;
      Utils.showLoading();
      try {
        GAME = await ProgLive.createGame({
          activityId: ACTIVITY.activity.id,
          activityTitle: ACTIVITY.activity.title,
          durationMinutes: minutes, penaltyPoints: penalty, maxViolations: maxV
        });
        STAGE = 'lobby';
        bindHostSubscriptions();
        renderStage('lobby');
      } catch (e) {
        Utils.showToast('Could not create contest: ' + (e.message || e), 'error');
      }
      Utils.hideLoading();
    }

    // ---------- SUBSCRIPTIONS ----------
    function bindHostSubscriptions() {
      CH_GAME = ProgLive.subscribeGame(GAME.id, (g) => {
        GAME = g;
        if (g.status === 'running' && STAGE === 'lobby') { STAGE = 'running'; renderStage('running'); }
        else if (g.status === 'ended' && STAGE !== 'setup') { STAGE = 'ended'; renderStage('ended'); }
      });
      CH_RES = ProgLive.subscribeResults(GAME.id, () => { if (STAGE === 'running' || STAGE === 'lobby') refreshBoard(); });
      CH_CHEAT = ProgLive.subscribeCheat(GAME.id, (row) => {
        SEEN_CHEAT.set(row.id, row);
        if (STAGE === 'running') renderViolations();
      });
      if (!CH_RES || !CH_GAME) {
        POLL = setInterval(() => { if (STAGE === 'running') refreshBoard(); }, 2000);
      }
    }

    // ---------- CONTROLS ----------
    async function startContest() {
      if (!GAME) return;
      if (!confirm('Start the contest now? Students can join before it starts, but the countdown only begins here.')) return;
      try {
        await ProgLive.startGame(GAME.id);
        GAME.status = 'running';
        STAGE = 'running'; renderStage('running');
        Utils.showToast('Contest started!', 'success');
      }
      catch (e) { Utils.showToast('Could not start: ' + (e.message || e), 'error'); }
    }
    async function endContestNow() {
      if (!GAME) return;
      if (!confirm('End the contest now? All outstanding work will stop and final scores lock in.')) return;
      try {
        await ProgLive.endGame(GAME.id);
        GAME.status = 'ended';
        STAGE = 'ended'; renderStage('ended');
      }
      catch (e) { Utils.showToast('Could not end contest', 'error'); }
    }
    async function extendContest() {
      if (!GAME || GAME.status !== 'running') return;
      const extra = parseInt(prompt('Add how many minutes?', '1'), 10) || 1;
      const started = new Date(GAME.started_at).getTime();
      const origEnd = started + (GAME.duration_minutes * 60000) - Date.now();
      const newDuration = Math.ceil((Math.max(origEnd, 0) / 60000)) + extra;
      try {
        const { error } = await supabaseClient.from('prog_games')
          .update({ duration_minutes: newDuration }).eq('id', GAME.id);
        if (error) throw error;
        GAME.duration_minutes = newDuration;
        Utils.showToast('Extended by ' + extra + ' min', 'success');
      } catch (e) { Utils.showToast('Could not extend', 'error'); }
    }
    function copyPin() {
      if (navigator.clipboard && GAME) { navigator.clipboard.writeText(GAME.pin).then(() => Utils.showToast('PIN copied', 'success')); }
    }
    function resetHost() {
      if (CH_GAME) { try { supabaseClient.removeChannel(CH_GAME); } catch (e) {} }
      if (CH_RES) { try { supabaseClient.removeChannel(CH_RES); } catch (e) {} }
      if (CH_CHEAT) { try { supabaseClient.removeChannel(CH_CHEAT); } catch (e) {} }
      if (POLL) clearInterval(POLL);
      GAME = null; SEEN_CHEAT = new Map();
      renderStage('setup');
      loadActivityList();
    }

    // ---------- RENDER ----------
    function renderStage(stage) {
      const el = $('plStage');
      if (stage === 'setup') el.innerHTML = setupView();
      else if (stage === 'config') el.innerHTML = configView();
      else if (stage === 'lobby') { el.innerHTML = lobbyView(); refreshBoard(); }
      else if (stage === 'running') { el.innerHTML = runningView(); refreshBoard(); renderViolations(); }
      else if (stage === 'ended') { el.innerHTML = endedView(); finalBoard(); }
      if ((stage === 'setup' || stage === 'config') && activityListNeeded()) loadActivityList();
    }
    function activityListNeeded() { return !!(document.getElementById('activityPicker')); }

    function setupView() {
      return '<div class="pl-center"><div class="pl-card">' +
        '<h1>Host a Live Contest</h1>' +
        '<p class="pl-sub">Pick a published activity. Your students join with a PIN and compete on a live leaderboard.</p>' +
        '<div id="activityPicker"></div>' +
      '</div></div>';
    }
    function configView() {
      const a = ACTIVITY && ACTIVITY.activity;
      return '<div class="pl-center"><div class="pl-card">' +
        '<h1>Host: ' + esc(a ? a.title : 'Activity') + '</h1>' +
        '<p class="pl-sub">' + (ACTIVITY ? ACTIVITY.problems.length : 0) + ' problems · ' + esc(a ? a.language : '') + ' · ' + esc(a ? (a.total_points || 0) : 0) + ' pts total</p>' +
        '<div class="pl-formrow"><label>Duration (minutes)</label><input id="cfgMinutes" type="number" min="1" max="240" value="' + ((a && a.time_limit_minutes) || 30) + '"></div>' +
        '<div class="pl-formrow"><label>Penalty per violation (pts)</label><input id="cfgPenalty" type="number" min="0" max="100" value="5"></div>' +
        '<div class="pl-formrow"><label>Max violations before lockout</label><input id="cfgMaxViol" type="number" min="1" max="10" value="3"></div>' +
        '<p class="pl-hint">Anti-cheat is ON automatically: students must stay in fullscreen; tab/window switches apply the penalty and count toward lockout.</p>' +
        '<div class="pl-actions">' +
          '<button class="btn btn-ghost" onclick="renderStage(\'setup\')">Back</button>' +
          '<button class="btn btn-primary" onclick="createContest()">Create Contest &amp; Get PIN</button>' +
        '</div>' +
      '</div></div>';
    }
    function lobbyView() {
      if (!GAME) return fatalCard('No contest in progress.');
      return '<div class="pl-center"><div class="pl-card">' +
        '<div class="pl-pinhead"><span class="pl-label">SHARE THIS PIN</span><div class="pl-pin" onclick="copyPin()">' + esc(GAME.pin) + '</div>' +
        '<button class="btn btn-ghost btn-sm" onclick="copyPin()">Copy</button></div>' +
        '<p class="pl-sub"><b>' + esc(GAME.activity_title) + '</b> · ' + GAME.duration_minutes + ' min · -' + GAME.penalty_points + ' pts/violation · max ' + GAME.max_violations + '</p>' +
        '<div class="pl-players"><div class="pl-label">JOINED PLAYERS <span id="plCount">0</span></div><div id="plPlayerList"><div class="pl-empty">Waiting for players…</div></div></div>' +
        '<div class="pl-actions"><button class="btn btn-ghost" onclick="resetHost()">Cancel</button>' +
        '<button class="btn btn-primary" onclick="startContest()">Start Contest</button></div>' +
      '</div></div>';
    }
    function runningView() {
      return '<div class="pl-center pl-wide"><div class="pl-card">' +
        '<div class="pl-runhead"><div><h1>' + esc(GAME.activity_title) + '</h1>' +
        '<div class="pl-runmeta"><span class="pl-badge pub">LIVE</span><span class="pl-runpin">PIN ' + esc(GAME.pin) + '</span></div></div>' +
        '<div class="pl-actions"><button class="btn btn-ghost btn-sm" onclick="extendContest()">+1 min</button>' +
        '<button class="btn btn-danger btn-sm" onclick="endContestNow()">End Contest</button></div></div>' +
        '<p class="pl-hint">Students are locked to fullscreen. Ending the contest stops the countdown and locks final scores.</p>' +
        '<div class="pl-leader" id="plBoard"><div class="pl-empty">Loading leaderboard…</div></div>' +
        '<div class="pl-cheatcard"><div class="pl-label">RULE VIOLATIONS (LIVE)</div><div id="plCheat" class="pl-cheatlist"><div class="pl-empty">No violations. Clean session!</div></div></div>' +
      '</div></div>';
    }
    function endedView() {
      return '<div class="pl-center pl-wide"><div class="pl-card">' +
        '<h1>Contest Ended</h1><p class="pl-sub">' + esc(GAME ? GAME.activity_title : '') + ' — results below.</p>' +
        '<div class="pl-leader" id="plBoard"><div class="pl-empty">Building final standings…</div></div>' +
        '<div class="pl-actions"><button class="btn btn-primary" onclick="resetHost()">Host Another Contest</button>' +
        '<a class="btn btn-ghost" href="programming.html">Back to Hub</a></div>' +
      '</div></div>';
    }

    // ---------- DATA: picks the number of problems solved etc ----------
    async function refreshBoard() {
      if (!GAME || (STAGE !== 'running' && STAGE !== 'lobby')) return;
      try {
        const rows = await ProgLive.listResults(GAME.id);
        const players = await ProgLive.listPlayers(GAME.id).catch(() => []);
        const board = $('plBoard');
        if (board) board.innerHTML = boardHTML(rows);
        const cnt = document.getElementById('plCount');
        if (cnt) cnt.textContent = (players.length || rows.length);
        const list = document.getElementById('plPlayerList');
        if (list) list.innerHTML = players.length
          ? players.map(p => '<div class="pl-player"><span class="pl-avatar">' + esc((p.player_name || '?').slice(0,1).toUpperCase()) + '</span><b>' + esc(p.player_name) + '</b><span class="pl-vchip">' + (p.violations || 0) + ' viol' + '</span></div>').join('')
          : '<div class="pl-empty">Waiting for players…</div>';
      } catch (e) {}
    }
    async function finalBoard() {
      if (!GAME) return;
      try {
        const rows = await ProgLive.listResults(GAME.id);
        $('plBoard').innerHTML = boardHTML(rows, true);
      } catch (e) {}
    }
    function boardHTML(rows, final) {
      if (!rows || !rows.length) return '<div class="pl-empty">No players have joined yet.</div>';
      const sorted = rows.slice().sort((x, y) => (y.total_score - x.total_score) || (x.updated_at || '').localeCompare(y.updated_at || ''));
      let html = '<div class="pl-boardhead"><span>#</span><span>Player</span><span>Score</span><span>Solved</span><span>Violations</span><span>Status</span></div>';
      sorted.forEach((r, i) => {
        const status = r.status === 'completed' ? 'done' : (r.status === 'submitted' ? 'sub' : 'live');
        html += '<div class="pl-brow ' + (i === 0 ? 'top' : '') + '">' +
          '<span class="pl-rank">' + (i + 1) + '</span>' +
          '<span class="pl-pname"><b>' + esc(r.player_name) + '</b></span>' +
          '<span class="pl-score"><b>' + (r.total_score || 0) + '</b> <small>/ ' + (r.total_points || 0) + '</small></span>' +
          '<span>' + (r.problems_solved || 0) + '</span>' +
          '<span class="' + ((r.violations || 0) ? 'pl-vbad' : '') + '">' + (r.violations || 0) + ' <small>(-' + (r.penalty_points || 0) + ')</small></span>' +
          '<span class="pl-status ' + status + '">' + (status === 'live' ? 'In progress' : status === 'sub' ? 'Submitted' : 'Done') + '</span>' +
        '</div>';
      });
      return html;
    }
    function renderViolations() {
      const box = $('plCheat');
      if (!box) return;
      const logs = Array.from(SEEN_CHEAT.values());
      if (!logs.length) { box.innerHTML = '<div class="pl-empty">No violations. Clean session!</div>'; return; }
      box.innerHTML = logs.slice(0, 20).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '')).map(l =>
        '<div class="pl-cheatrow"><b>' + esc(l.player_name || 'player') + '</b><span>' + esc(l.reason) + '</span>' +
        '<time>' + new Date(l.created_at).toLocaleTimeString() + '</time></div>').join('');
    }

    document.addEventListener('DOMContentLoaded', hostBoot);
  </script>
</body>
</html>
