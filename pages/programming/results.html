<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results - WQTech Programming</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/programming.css">
  <script>document.documentElement.classList.add('auth-gate');</script>
  <style>
    .auth-gate body { visibility: hidden; }
    .prog-code-details { margin-top: 8px; }
    .prog-code-details summary { cursor: pointer; font-size: 0.78rem; font-weight: 700; color: var(--accent); }
    .prog-code-pre { background: var(--bg-secondary); border: 1px solid var(--card-border); border-radius: 8px;
      padding: 10px 12px; margin: 6px 0 0; font-family: 'SFMono-Regular', Consolas, 'Cascadia Mono', monospace;
      font-size: 0.75rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--text-secondary); }
  </style>
  </head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>

  <nav class="navbar">
      <a href="programming.html" class="navbar-brand">WQTech <span>Programming</span></a>
      <div class="navbar-actions">
        <span class="prog-role-tag" id="roleTag" style="display:none;">Teacher</span>
        <span class="prog-user" id="userName"></span>
        <a href="../dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
        <a href="../game.html" class="btn btn-ghost btn-sm">Quiz</a>
        <button class="theme-toggle" onclick="Theme.toggle()" aria-label="Toggle theme">
        <div class="knob">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
      </button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
      </div>
    </nav>

  <main class="prog-page">
    <header class="prog-hero">
      <div>
        <h1 id="activityTitle">Results</h1>
        <p id="activityMeta"></p>
      </div>
      <a href="programming.html" class="prog-btn prog-btn-ghost prog-btn-sm">&larr; Back to hub</a>
    </header>

    <div id="summaryArea"></div>
    <div id="dataArea"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/piston-config.js"></script>
  <script src="../../js/programming-shared.js"></script>

  <script>
    // ============================================================
    // RESULTS | roll-up + per-problem breakdown (teacher/student)
    // ============================================================

    const params = new URLSearchParams(location.search);
    const ACTIVITY_ID = params.get('activity') || '';
    const view = { isTeacher: false, activity: null, problems: [], students: [] };

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (!user) { window.location.href = '../index.html'; return; }
      if (!ACTIVITY_ID) { window.location.href = 'programming.html'; return; }
      view.isTeacher = await Programming.isTeacher();
      document.documentElement.classList.remove('auth-gate');
      const name = (Auth.currentUser && Auth.currentUser.user_metadata && Auth.currentUser.user_metadata.name) || 'user';
      document.getElementById('userName').textContent = name;
      document.getElementById('roleTag').style.display = view.isTeacher ? 'inline-flex' : 'none';
      await loadAll();
    });

    async function loadAll() {
      Utils.showLoading();
      try {
        const loaded = await Programming.loadActivity(ACTIVITY_ID);
        if (!loaded.activity) throw new Error('not found');
        view.activity = loaded.activity;
        view.problems = loaded.problems || [];
        document.getElementById('activityTitle').textContent = loaded.activity.title || 'Results';
        document.getElementById('activityMeta').textContent =
          view.problems.length + ' problem' + (view.problems.length === 1 ? '' : 's') +
          ' &middot; ' + (loaded.activity.total_points || 0) + ' pts' +
          ' &middot; ' + loaded.activity.time_limit_minutes + ' min' +
          ' &middot; ' + capLang(loaded.activity.language);
        if (view.isTeacher) await loadTeacher();
        else await loadStudent();
      } catch (e) {
        console.error(e);
        Utils.hideLoading();
        Utils.showToast('Could not load results', 'error');
        window.location.href = 'programming.html';
      }
    }

    async function loadTeacher() {
      try {
        const [res, subs] = await Promise.all([
          supabaseClient.from('programming_results').select('*').eq('activity_id', ACTIVITY_ID).order('total_score', { ascending: false }),
          supabaseClient.from('programming_submissions').select('*').eq('activity_id', ACTIVITY_ID).order('submitted_at', { ascending: false })
        ]);
        const results = (res && res.data) || [];
        const submissions = (subs && subs.data) || [];
        const latest = latestPerStudentProblem(submissions);
        view.students = results.map(r => buildStudent(r, latest[r.student_id] || []));
        Utils.hideLoading();
        renderSummary();
        renderStudentTable();
      } catch (e) {
        Utils.hideLoading();
        console.error(e);
        Utils.showToast('Could not load results', 'error');
      }
    }

    async function loadStudent() {
      const uid = Programming.uid();
      try {
        const [res, subs] = await Promise.all([
          supabaseClient.from('programming_results').select('*').eq('activity_id', ACTIVITY_ID).eq('student_id', uid).order('submitted_at', { ascending: false }),
          supabaseClient.from('programming_submissions').select('*').eq('activity_id', ACTIVITY_ID).eq('student_id', uid).order('submitted_at', { ascending: false })
        ]);
        const results = (res && res.data) || [];
        const submissions = (subs && subs.data) || [];
        const latest = latestPerStudentProblem(submissions);
        const mine = latest[uid] || [];
        const classPts = view.problems.reduce((a, p) => a + (p.points || 0), 0);
        const earned = mine.reduce((a, s) => a + (s.score || 0), 0);
        let last = null;
        mine.forEach(s => {
          const t = new Date(s.submitted_at).getTime();
          if (!last || t > last) last = t;
        });
        Utils.hideLoading();
        const area = document.getElementById('dataArea');
        if (!results.length && !mine.length) {
          area.innerHTML =
            '<div class="prog-empty"><div class="prog-empty-icon">&lt;/&gt;</div>' +
            '<p>You haven&rsquo;t attempted this activity yet, so there are no results to show.</p>' +
            '<div class="prog-cta"><a class="prog-btn prog-btn-success" href="activity.html?id=' + ACTIVITY_ID + '">Start Activity</a></div></div>';
          return;
        }
        const row = results[0] || {
          student_id: uid,
          student_name: name() + ' (you)',
          total_score: earned,
          total_points: classPts,
          status: 'in_progress',
          submitted_at: last ? new Date(last).toISOString() : null
        };
        view.students = [buildStudent(row, mine)];
        renderSummary();
        renderStudentTable();
      } catch (e) {
        Utils.hideLoading();
        console.error(e);
        Utils.showToast('Could not load results', 'error');
      }
    }

    function name() {
      return (Auth.currentUser && Auth.currentUser.user_metadata && Auth.currentUser.user_metadata.name) || 'Student';
    }

    function latestPerStudentProblem(submissions) {
      const out = {};
      const seen = {};
      submissions.forEach(s => {
        const key = s.student_id + '|' + s.problem_id;
        if (seen[key]) return;
        seen[key] = true;
        (out[s.student_id] = out[s.student_id] || []).push(s);
      });
      return out;
    }

    function buildStudent(r, subs) {
      const per = {};
      subs.forEach(s => { per[s.problem_id] = s; });
      let correct = 0, wrong = 0;
      view.problems.forEach(p => {
        const s = per[p.id];
        if (!s) return;
        if (s.status === 'accepted') correct++; else wrong++;
      });
      return Object.assign({}, r, { per: per, correct: correct, wrong: wrong, total: view.problems.length });
    }

    function renderSummary() {
      const area = document.getElementById('summaryArea');
      if (!view.isTeacher) {
        area.innerHTML = '';
        return;
      }
      const n = view.students.length;
      const earned = view.students.reduce((a, s) => a + (s.total_score || 0), 0);
      const classPts = view.problems.reduce((a, p) => a + (p.points || 0), 0) || 1;
      const possible = classPts * n;
      const top = view.students.reduce((a, s) => Math.max(a, s.total_score || 0), 0);
      const done = view.students.filter(s => s.status === 'completed').length;
      area.innerHTML =
        '<div class="prog-summary">' +
          '<div class="prog-stat"><div class="prog-stat-value">' + n + '</div><div class="prog-stat-label">Students</div></div>' +
          '<div class="prog-stat"><div class="prog-stat-value">' + earned + '/' + possible + '</div><div class="prog-stat-label">Class Total</div></div>' +
          '<div class="prog-stat"><div class="prog-stat-value">' + (n ? Math.round(earned / n) : 0) + '</div><div class="prog-stat-label">Class Average</div></div>' +
          '<div class="prog-stat"><div class="prog-stat-value">' + top + '</div><div class="prog-stat-label">Top Score (pts)</div></div>' +
          '<div class="prog-stat"><div class="prog-stat-value">' + done + '/' + n + '</div><div class="prog-stat-label">Completed</div></div>' +
        '</div>';
    }

    function renderStudentTable() {
      const area = document.getElementById('dataArea');
      let note = '';
      if (!view.isTeacher && view.students.length) {
        const s = view.students[0];
        const v = parseInt((s && s.violations) || 0, 10);
        note = '<p class="prog-hero-note" style="margin-bottom:14px;">Your own result &mdash; last submitted ' + fmtDT(s.submitted_at) + '.' +
          (v ? ' <b>' + v + ' rule violation' + (v > 1 ? 's' : '') + ' (-' + (parseInt((s && s.penalty_points) || 0, 10)) + ' pts)</b> already deducted from your final score.'
             : ' No rule violations were recorded for you.') + '</p>';
      }
      if (!view.students.length) {
        area.innerHTML = note + '<div class="prog-empty"><div class="prog-empty-icon">&#128197;</div><p>No students have finished this activity yet.</p></div>';
        return;
      }
      let body = '';
      view.students.forEach((s, i) => {
        body += '<tr class="prog-rrow" onclick="toggleStudent(' + i + ')">' +
          '<td><strong>' + Utils.sanitize(s.student_name || 'Student') + '</strong><br><small class="prog-muted">' + String(s.student_id).substring(0, 8) + '&hellip;</small></td>' +
          '<td class="prog-testcase-pass">' + s.correct + '</td>' +
          '<td class="prog-testcase-fail">' + s.wrong + '</td>' +
          '<td>' + s.total + '</td>' +
          '<td><strong>' + (s.total_score || 0) + '/' + (s.total_points || 0) + '</strong></td>' +
          '<td>' + statusPill(s.status) + '</td>' +
          '<td class="prog-muted">' + fmtDT(s.submitted_at) + '</td>' +
        '</tr>' +
        '<tr class="prog-detail-row" id="detail-' + i + '" style="display:none;">' +
          '<td colspan="7">' + detailHTML(s, i) + '</td>' +
        '</tr>';
      });
      area.innerHTML = note +
        '<div class="prog-table-wrap"><table class="prog-table"><thead><tr>' +
          '<th>Student</th><th>Correct</th><th>Wrong</th><th>Total</th><th>Score</th><th>Status</th><th>Submitted At</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>';
    }

    function detailHTML(s, si) {
      if (!view.problems.length) return '<em>No problems in this activity.</em>';
      let h = '<table class="prog-table prog-sub-table"><thead><tr>' +
        '<th>Problem</th><th>Score</th><th>Result</th><th>Sample</th><th>Hidden</th><th>Last At</th>' +
        '</tr></thead><tbody>';
      view.problems.forEach((p, j) => {
        const sub = s.per[p.id];
        if (!sub) {
          h += '<tr class="prog-muted"><td><strong>Problem #' + (j + 1) + '</strong> &mdash; ' + Utils.sanitize(p.title) + '</td>' +
            '<td>&mdash;</td><td>Not attempted</td><td></td><td></td><td>&mdash;</td></tr>';
        } else {
          h += '<tr class="prog-rrow" onclick="toggleSub(' + si + ',' + j + ')">' +
            '<td><strong>Problem #' + (j + 1) + '</strong> &mdash; ' + Utils.sanitize(p.title) + '</td>' +
            '<td><strong>' + (sub.score || 0) + '/' + (sub.max_score || 0) + '</strong></td>' +
            '<td>' + statusPill(sub.status) + '</td>' +
            '<td>' + (sub.sample_passed || 0) + '/' + (sub.sample_total || 0) + '</td>' +
            '<td>' + (sub.hidden_passed || 0) + '/' + (sub.hidden_total || 0) + '</td>' +
            '<td class="prog-muted">' + fmtDT(sub.submitted_at) + '</td>' +
          '</tr>' +
          '<tr id="subdetail-' + si + '-' + j + '" style="display:none;">' +
            '<td colspan="6">' + codeDetail(sub) + testCaseTable(sub) + '</td>' +
          '</tr>';
        }
      });
      return h + '</tbody></table>';
    }

    function codeDetail(sub) {
      const code = (sub && sub.source_code) ? String(sub.source_code) : '';
      if (!code) return '';
      return '<details class="prog-code-details"><summary>Show submitted code</summary>' +
        '<pre class="prog-code-pre">' + Utils.sanitize(code) + '</pre></details>';
    }

    function testCaseTable(sub) {
      let arr = [];
      try {
        arr = Array.isArray(sub.test_results) ? sub.test_results : (sub.test_results ? [sub.test_results] : []);
      } catch (e) { arr = []; }
      if (!arr.length) return '<em class="prog-muted">No test-case details recorded for this run.</em>';
      let h = '<table class="prog-table prog-sub-table"><thead><tr>' +
        '<th>Case</th><th>Result</th><th>Points</th><th>Runtime</th><th>Message</th>' +
        '</tr></thead><tbody>';
      arr.forEach(t => {
        const ok = !!t.passed;
        h += '<tr><td class="prog-mono">' + Utils.sanitize(t.label || 'Test') + '</td>' +
          '<td class="' + (ok ? 'prog-testcase-pass' : 'prog-testcase-fail') + '">' + (ok ? '&#10003; Passed' : '&#10007; Failed') + '</td>' +
          '<td>' + (ok ? (t.points || 0) : 0) + '</td>' +
          '<td class="prog-muted">' + Math.round(t.runtime_ms || 0) + ' ms</td>' +
          '<td>' + Utils.sanitize(t.message || (ok ? 'Passed' : 'Failed')) + '</td></tr>';
      });
      return h + '</tbody></table>';
    }

    function statusPill(st) {
      const map = {
        accepted: ['ok', 'Accepted'],
        wrong_answer: ['err', 'Wrong Answer'],
        compilation_error: ['warn', 'Compile Error'],
        runtime_error: ['warn', 'Runtime Error'],
        time_limit_exceeded: ['warn', 'TLE'],
        memory_limit_exceeded: ['warn', 'MLE'],
        execution_service_error: ['err', 'Execution Service Error'],
        pending: ['info', 'Pending'],
        completed: ['ok', 'Completed'],
        in_progress: ['info', 'In Progress'],
        incomplete: ['warn', 'Incomplete'],
        in_progress_unknown: ['info', 'In Progress']
      };
      const hit = map[st] || ['info', st || '&mdash;'];
      return '<span class="prog-pill ' + hit[0] + '">' + hit[1] + '</span>';
    }

    function toggleStudent(si) {
      const row = document.getElementById('detail-' + si);
      if (!row) return;
      row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
    }

    function toggleSub(si, j) {
      const row = document.getElementById('subdetail-' + si + '-' + j);
      if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
    }

    function capLang(lang) {
      const hit = Programming.LANGUAGES.find(l => l.id === lang || l.label === lang);
      return hit ? hit.label : (lang || 'C++');
    }

    function fmtDT(iso) {
      if (!iso) return '&mdash;';
      try { return new Date(iso).toLocaleString(); } catch (e) { return '&mdash;'; }
    }

    async function logout() { await Auth.logout(); window.location.href = '../index.html'; }
  </script>
</body>
</html>
